name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: :desktopApp:packageDeb
            artifact-path: desktopApp/build/compose/binaries/**/*.deb
            artifact-name: PortX-Linux-deb
          - os: macos-latest
            task: :desktopApp:packageDmg
            artifact-path: desktopApp/build/compose/binaries/**/*.dmg
            artifact-name: PortX-macOS-dmg
          - os: windows-latest
            task: :desktopApp:packageReleaseMsi
            artifact-path: desktopApp/build/compose/binaries/**/*.msi
            artifact-name: PortX-Windows-msi

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            chmod +x gradlew
          fi
        shell: bash

      - name: Build Desktop Package
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./gradlew.bat ${{ matrix.task }} --stacktrace
          else
            ./gradlew ${{ matrix.task }} --stacktrace
          fi
        shell: bash

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      - name: Set up Android SDK Platform 37 and licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" || true
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37" || true
          fi
        shell: bash

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace
        shell: bash

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PortX-Android-apk
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p dist
          find release-assets -type f \( -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.apk" \) -exec cp {} dist/ \;
          ls -la dist/
        shell: bash

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v5.1.0' }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
