name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: :desktopApp:packageDeb
            artifact-path: desktopApp/build/compose/binaries/main/deb/*.deb
            artifact-name: PortX-Linux-deb
          - os: macos-latest
            task: :desktopApp:packageDmg
            artifact-path: desktopApp/build/compose/binaries/main/dmg/*.dmg
            artifact-name: PortX-macOS-dmg
          - os: windows-latest
            task: :desktopApp:packageReleaseMsi
            artifact-path: desktopApp/build/compose/binaries/main-release/msi/*.msi
            artifact-name: PortX-Windows-msi

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Desktop Package
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./gradlew.bat ${{ matrix.task }} --stacktrace
          else
            ./gradlew ${{ matrix.task }} --stacktrace
          fi
        shell: bash

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace
        shell: bash

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PortX-Android-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p dist
          find release-assets -type f \( -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.apk" \) -exec cp {} dist/ \;
          ls -la dist/
        shell: bash

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
